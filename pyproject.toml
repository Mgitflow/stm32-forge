[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501",   # 行长度（长字符串是合理的）
    "B904",   # raise from（部分代码不需要链式异常）
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

# 刻意的路径引导模式（sys.path 必须先于项目内导入），不是代码异味
[tool.ruff.lint.per-file-ignores]
"src/api/server.py" = ["E402", "N803"]   # sys.path 引导 + http.server 惯例签名
"scripts/**" = ["E402"]                   # 开发/自检脚本：sys.path 引导后导入项目包

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short --strict-markers -p no:cacheprovider"
